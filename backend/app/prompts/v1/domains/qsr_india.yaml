locale_notes: |
  - Customers may mix Hindi and English (Hinglish) — handle gracefully
  - "veg burger chahiye" means "I want a veg burger"
  - "bhai" is an informal address, treat respectfully (means "brother")
  - "kuch spicy do" means "give me something spicy"
  - "ek aur dena" means "give me one more"
  - "bas" or "bas kar" means "that is enough / stop / I am done"
  - "kitna?" means "how much?" (asking for price)
  - "theek hai" means "okay / alright"
  - "nahi chahiye" means "I do not want it" (decline)
  - Treat all customers respectfully regardless of language used
